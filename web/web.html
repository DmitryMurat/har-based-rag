<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>База знаний по видеоурокам</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%231a73e8'/%3E%3Cpath d='M12 6.4c-1.7-1.15-4.05-1.75-6.35-1.75a.65.65 0 0 0-.65.65v10.6c0 .37.3.66.67.65 2.2-.08 4.4.5 5.9 1.6a.75.75 0 0 0 .86 0c1.5-1.1 3.7-1.68 5.9-1.6.37.01.67-.28.67-.65V5.3a.65.65 0 0 0-.65-.65c-2.3 0-4.65.6-6.35 1.75z' fill='white'/%3E%3Cpath d='M12 6.4v11.4' stroke='%231a73e8' stroke-width='0.9' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script>
  // Применяем сохранённую тему до отрисовки, чтобы не было мигания.
  (function () {
    var saved = localStorage.getItem("theme");
    if (saved === "dark" || saved === "light") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  })();
</script>
</head>
<body>
  <div class="header-row">
    <h1>Задайте вопрос по загруженным видеоурокам</h1>
    <button id="theme-toggle" aria-label="Переключить тему" title="Переключить тему">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <div id="question-row">
    <div class="field-wrap">
      <input id="question" type="text" placeholder="Введите вопрос и нажмите Enter">
      <button id="ask" aria-label="Спросить" title="Спросить">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="btn-spinner"></span>
      </button>
    </div>
  </div>
  <div id="status"><span class="status-spinner"></span><span id="status-text"></span></div>
  <div id="answer"></div>
  <div id="sources"></div>
  <div id="suggestions"></div>
  <audio id="audio-player" preload="none"></audio>

<script>
const themeToggle = document.getElementById("theme-toggle");
const questionInput = document.getElementById("question");
const askButton = document.getElementById("ask");
const statusEl = document.getElementById("status");
const statusTextEl = document.getElementById("status-text");
const answerEl = document.getElementById("answer");
const suggestionsEl = document.getElementById("suggestions");
const sourcesEl = document.getElementById("sources");
const audioPlayer = document.getElementById("audio-player");

function formatTimestamp(seconds) {
  const total = Math.trunc(seconds);
  const m = Math.trunc(total / 60);
  const s = total % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

function escapeHtml(text) {
  // Ручное экранирование, а не div.textContent -> div.innerHTML: последнее не трогает
  // кавычки (они не спецсимволы в текстовом узле), а этот же результат подставляется и
  // в значения HTML-атрибутов (data-question, data-item и т.п.), где кавычка внутри
  // текста обрывает атрибут раньше времени и ломает разметку.
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function renderAnswer(text) {
  const escaped = escapeHtml(text);
  answerEl.innerHTML = escaped.replace(/\*\*([\s\S]+?)\*\*/g, "<strong>$1</strong>");
}

const PLAY_ICON_HTML = `<span class="play-icon">
  <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M7 5v14l12-7z"/></svg>
  <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="6" width="12" height="12"/></svg>
</span>`;

let currentAudioUrl = null;

function stopPlayback() {
  document.querySelectorAll("#sources .chips li.playing, #sources .chips li.loading")
    .forEach(el => el.classList.remove("playing", "loading"));
  audioPlayer.pause();
  audioPlayer.removeAttribute("src");
  audioPlayer.load();
  if (currentAudioUrl) {
    URL.revokeObjectURL(currentAudioUrl);
    currentAudioUrl = null;
  }
}

async function playSource(li) {
  const wasPlayingThis = li.classList.contains("playing") || li.classList.contains("loading");
  stopPlayback();
  if (wasPlayingThis) return; // повторный клик по тому же фрагменту — просто остановить

  const url = li.dataset.lesson !== undefined
    ? `/audio-lesson?lesson=${encodeURIComponent(li.dataset.lesson)}`
    : `/audio?item=${encodeURIComponent(li.dataset.item)}&start=${encodeURIComponent(li.dataset.start)}&end=${encodeURIComponent(li.dataset.end)}`;

  li.classList.add("loading");
  setStatus("");

  try {
    const res = await fetch(url);
    if (!res.ok) {
      let message = `Не удалось воспроизвести фрагмент (${res.status}).`;
      try {
        const data = await res.json();
        if (data.error) message = data.error;
      } catch (_) { /* тело не JSON — оставляем сообщение по умолчанию */ }
      li.classList.remove("loading");
      setStatus(message);
      return;
    }
    const blob = await res.blob();
    if (!li.classList.contains("loading")) return; // пользователь успел кликнуть что-то ещё, пока грузилось

    currentAudioUrl = URL.createObjectURL(blob);
    audioPlayer.src = currentAudioUrl;
    li.classList.remove("loading");
    li.classList.add("playing");
    await audioPlayer.play();
  } catch (e) {
    li.classList.remove("loading");
    setStatus("Ошибка соединения с сервером: " + e);
  }
}

audioPlayer.addEventListener("ended", stopPlayback);

sourcesEl.addEventListener("click", (e) => {
  const li = e.target.closest("li");
  if (li) playSource(li);
});

suggestionsEl.addEventListener("click", (e) => {
  const btn = e.target.closest(".suggestion-ask");
  if (!btn || answerLoading) return;
  questionInput.value = btn.dataset.question;
  ask();
});

function setStatus(text, variant = "error") {
  if (!text) {
    statusEl.classList.remove("visible", "info");
    statusTextEl.textContent = "";
    return;
  }
  statusTextEl.textContent = text;
  statusEl.classList.toggle("info", variant === "info");
  statusEl.classList.add("visible");
}

let answerLoading = false;

function renderSuggestions(questions) {
  if (!questions || !questions.length) {
    suggestionsEl.innerHTML = "";
    return;
  }
  const rows = questions
    .map(q => `<li><span class="suggestion-text">${escapeHtml(q)}</span>` +
      `<button type="button" class="suggestion-ask" data-question="${escapeHtml(q)}">Узнать</button></li>`)
    .join("");
  suggestionsEl.innerHTML = '<ul class="suggestion-list">' + rows + "</ul>";
}

function renderSuggestionsLoading() {
  suggestionsEl.innerHTML = '<div class="suggestions-loading">' +
    '<span class="status-spinner"></span><span>Формируется список расширенных вопросов</span></div>';
}

function renderSources(sources) {
  if (!sources || !sources.length) return;
  const items = sources
    .map(s => s.lesson_number !== undefined
      ? `<li data-lesson="${escapeHtml(String(s.lesson_number))}">` +
        PLAY_ICON_HTML +
        `<span class="src-info">` +
        `<span class="src-lesson">${escapeHtml(s.label)}</span>` +
        `<span class="src-time">Слушать полностью</span>` +
        `</span></li>`
      : `<li data-item="${escapeHtml(s.item_name)}" data-start="${s.start}" data-end="${s.end}">` +
        PLAY_ICON_HTML +
        `<span class="src-info">` +
        `<span class="src-lesson">${escapeHtml(s.item_name)}</span>` +
        `<span class="src-time">${formatTimestamp(s.start)} - ${formatTimestamp(s.end)}</span>` +
        `</span></li>`)
    .join("");
  sourcesEl.innerHTML = '<ul class="chips">' + items + "</ul>";
}

let modelReady = false;
let activeRequestId = 0;
let currentAbortController = null;

async function ask() {
  if (answerLoading || !modelReady) return;

  const question = questionInput.value.trim();
  if (!question) return;

  // Если предыдущий вопрос ещё тянет follow-up-вопросы в фоне (сам ответ уже показан,
  // поле уже разблокировано — см. ниже) — тихо обрываем его: и клиент перестаёт читать
  // тот поток, и сервер, наткнувшись на разрыв соединения, сам всё корректно погасит
  // (см. коммит про BrokenPipeError).
  if (currentAbortController) currentAbortController.abort();
  const myRequestId = ++activeRequestId;
  const abortController = new AbortController();
  currentAbortController = abortController;
  const isCurrent = () => myRequestId === activeRequestId;

  answerLoading = true;
  stopPlayback();
  questionInput.setSelectionRange(questionInput.value.length, questionInput.value.length);
  askButton.classList.add("loading");
  questionInput.readOnly = true;
  setStatus("");
  answerEl.textContent = "";
  suggestionsEl.innerHTML = "";
  sourcesEl.innerHTML = "";

  // Основной ответ получен (успешно, "не нашлось" или ошибка) — дальше пользователь
  // уже может печатать новый вопрос, даже если follow-up-вопросы для этого ответа ещё
  // грузятся в фоне.
  function unlockInput() {
    if (!isCurrent()) return; // запрос уже устарел — не трогаем состояние более нового
    answerLoading = false;
    askButton.classList.remove("loading");
    questionInput.readOnly = false;
  }

  let followupsPending = false;

  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
      signal: abortController.signal,
    });
    if (!isCurrent()) return;

    if (!res.ok) {
      let data = {};
      try { data = await res.json(); } catch (_) { /* тело не JSON */ }
      setStatus("Ошибка: " + (data.error || res.status));
      return;
    }

    const contentType = res.headers.get("Content-Type") || "";
    if (!contentType.includes("x-ndjson")) {
      // Синхронный JSON-ответ — вопрос отсеян ещё до обращения к LLM (эвристика по
      // расстоянию), стримить и ждать follow-up в этом случае нечего.
      const data = await res.json();
      if (!isCurrent()) return;
      renderAnswer(data.answer);
      renderSuggestions(data.suggested_questions);
      renderSources(data.sources);
      return;
    }

    // Потоковый ответ: по одной JSON-строке на событие.
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    let answerText = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done || !isCurrent()) break;
      buf += decoder.decode(value, { stream: true });

      let newlineAt;
      while ((newlineAt = buf.indexOf("\n")) !== -1) {
        const line = buf.slice(0, newlineAt);
        buf = buf.slice(newlineAt + 1);
        if (!line || !isCurrent()) continue;

        const event = JSON.parse(line);
        if (event.type === "chunk") {
          answerText += event.text;
          renderAnswer(answerText);
        } else if (event.type === "no_match") {
          renderAnswer(event.answer);
          unlockInput();
          renderSuggestions(event.suggested_questions);
        } else if (event.type === "done") {
          renderSources(event.sources);
          unlockInput();
          if (event.sources && event.sources.length && !event.is_summary) {
            renderSuggestionsLoading();
            followupsPending = true;
          }
        } else if (event.type === "follow_ups") {
          followupsPending = false;
          renderSuggestions(event.questions);
        } else if (event.type === "error") {
          setStatus(event.error);
          unlockInput();
        }
      }
    }

    // Поток закрылся сам, а follow-up так и не пришли (пусто/сбой на сервере) —
    // спиннер под источниками не должен висеть вечно.
    if (isCurrent() && followupsPending) {
      suggestionsEl.innerHTML = "";
    }
  } catch (e) {
    if (e.name === "AbortError") return; // новый вопрос пользователя тихо отменил этот запрос
    if (isCurrent()) setStatus("Ошибка соединения с сервером: " + e);
  } finally {
    unlockInput();
    if (currentAbortController === abortController) currentAbortController = null;
  }
}

function currentTheme() {
  const explicit = document.documentElement.getAttribute("data-theme");
  if (explicit) return explicit;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

themeToggle.addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
});

askButton.addEventListener("click", ask);
questionInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") ask();
});

// Страница уже видна, но модель эмбеддингов ещё грузится в фоне на сервере (см.
// web.py) — блокируем поле ввода и опрашиваем /status, пока не станет ready: true.
questionInput.readOnly = true;
setStatus("Пожалуйста, подождите, загружается модель эмбеддингов...", "info");
const statusPoll = setInterval(async () => {
  try {
    const res = await fetch("/status");
    const data = await res.json();
    if (data.ready) {
      clearInterval(statusPoll);
      modelReady = true;
      questionInput.readOnly = false;
      setStatus("");
    }
  } catch (_) { /* сервер мог ещё не успеть подняться — просто попробуем на следующем тике */ }
}, 500);

// Heartbeat — пока страница открыта, сервер знает, что он ещё нужен.
setInterval(() => {
  fetch("/ping").catch(() => {});
}, 3000);

// Мгновенное закрытие сервера при закрытии/уходе со страницы.
function notifyShutdown() {
  navigator.sendBeacon("/shutdown");
}
window.addEventListener("pagehide", notifyShutdown);
window.addEventListener("beforeunload", notifyShutdown);
</script>
</body>
</html>
