<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>База знаний по видеоурокам</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script>
  // Применяем сохранённую тему до отрисовки, чтобы не было мигания.
  (function () {
    var saved = localStorage.getItem("theme");
    if (saved === "dark" || saved === "light") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  })();
</script>
</head>
<body>
  <div class="header-row">
    <h1>Введите вопрос по загруженным видеоурокам</h1>
    <button id="theme-toggle" aria-label="Переключить тему" title="Переключить тему">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <div id="question-row">
    <div class="field-wrap">
      <input id="question" type="text" placeholder="Введите вопрос и нажмите Enter">
      <button id="ask" aria-label="Спросить" title="Спросить">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="btn-spinner"></span>
      </button>
    </div>
  </div>
  <div id="status"><span id="status-text"></span></div>
  <div id="answer"></div>
  <div id="suggestions"></div>
  <div id="sources"></div>
  <audio id="audio-player" preload="none"></audio>

<script>
const themeToggle = document.getElementById("theme-toggle");
const questionInput = document.getElementById("question");
const askButton = document.getElementById("ask");
const statusEl = document.getElementById("status");
const statusTextEl = document.getElementById("status-text");
const answerEl = document.getElementById("answer");
const suggestionsEl = document.getElementById("suggestions");
const sourcesEl = document.getElementById("sources");
const audioPlayer = document.getElementById("audio-player");

function formatTimestamp(seconds) {
  const total = Math.trunc(seconds);
  const m = Math.trunc(total / 60);
  const s = total % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function renderAnswer(text) {
  const escaped = escapeHtml(text);
  answerEl.innerHTML = escaped.replace(/\*\*([\s\S]+?)\*\*/g, "<strong>$1</strong>");
}

const PLAY_ICON_HTML = `<span class="play-icon">
  <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M7 5v14l12-7z"/></svg>
  <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="6" width="12" height="12"/></svg>
</span>`;

let currentAudioUrl = null;

function stopPlayback() {
  document.querySelectorAll("#sources .chips li.playing, #sources .chips li.loading")
    .forEach(el => el.classList.remove("playing", "loading"));
  audioPlayer.pause();
  audioPlayer.removeAttribute("src");
  audioPlayer.load();
  if (currentAudioUrl) {
    URL.revokeObjectURL(currentAudioUrl);
    currentAudioUrl = null;
  }
}

async function playSource(li) {
  const wasPlayingThis = li.classList.contains("playing") || li.classList.contains("loading");
  stopPlayback();
  if (wasPlayingThis) return; // повторный клик по тому же фрагменту — просто остановить

  const item = li.dataset.item;
  const start = li.dataset.start;
  const end = li.dataset.end;
  const url = `/audio?item=${encodeURIComponent(item)}&start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`;

  li.classList.add("loading");
  setStatus("");

  try {
    const res = await fetch(url);
    if (!res.ok) {
      let message = `Не удалось воспроизвести фрагмент (${res.status}).`;
      try {
        const data = await res.json();
        if (data.error) message = data.error;
      } catch (_) { /* тело не JSON — оставляем сообщение по умолчанию */ }
      li.classList.remove("loading");
      setStatus(message);
      return;
    }
    const blob = await res.blob();
    if (!li.classList.contains("loading")) return; // пользователь успел кликнуть что-то ещё, пока грузилось

    currentAudioUrl = URL.createObjectURL(blob);
    audioPlayer.src = currentAudioUrl;
    li.classList.remove("loading");
    li.classList.add("playing");
    await audioPlayer.play();
  } catch (e) {
    li.classList.remove("loading");
    setStatus("Ошибка соединения с сервером: " + e);
  }
}

audioPlayer.addEventListener("ended", stopPlayback);

sourcesEl.addEventListener("click", (e) => {
  const li = e.target.closest("li");
  if (li) playSource(li);
});

suggestionsEl.addEventListener("click", (e) => {
  const btn = e.target.closest(".suggestion-ask");
  if (!btn || isLoading) return;
  questionInput.value = btn.dataset.question;
  ask();
});

function setStatus(text) {
  if (!text) {
    statusEl.classList.remove("visible");
    statusTextEl.textContent = "";
    return;
  }
  statusTextEl.textContent = text;
  statusEl.classList.add("visible");
}

let isLoading = false;

async function ask() {
  if (isLoading) return;

  const question = questionInput.value.trim();
  if (!question) return;

  isLoading = true;
  stopPlayback();
  askButton.classList.add("loading");
  questionInput.readOnly = true;
  setStatus("");
  answerEl.textContent = "";
  suggestionsEl.innerHTML = "";
  sourcesEl.innerHTML = "";

  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();

    if (!res.ok) {
      setStatus("Ошибка: " + (data.error || res.status));
      return;
    }

    renderAnswer(data.answer);

    if (data.suggested_questions && data.suggested_questions.length) {
      const rows = data.suggested_questions
        .map(q => `<li><span class="suggestion-text">${escapeHtml(q)}</span>` +
          `<button type="button" class="suggestion-ask" data-question="${escapeHtml(q)}">Узнать</button></li>`)
        .join("");
      suggestionsEl.innerHTML = '<ul class="suggestion-list">' + rows + "</ul>";
    }

    if (data.sources && data.sources.length) {
      const items = data.sources
        .map(s => `<li data-item="${escapeHtml(s.item_name)}" data-start="${s.start}" data-end="${s.end}">` +
          PLAY_ICON_HTML +
          `<span class="src-info">` +
          `<span class="src-lesson">${escapeHtml(s.item_name)}</span>` +
          `<span class="src-time">${formatTimestamp(s.start)} - ${formatTimestamp(s.end)}</span>` +
          `</span></li>`)
        .join("");
      sourcesEl.innerHTML = '<ul class="chips">' + items + "</ul>";
    }
  } catch (e) {
    setStatus("Ошибка соединения с сервером: " + e);
  } finally {
    isLoading = false;
    askButton.classList.remove("loading");
    questionInput.readOnly = false;
  }
}

function currentTheme() {
  const explicit = document.documentElement.getAttribute("data-theme");
  if (explicit) return explicit;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

themeToggle.addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
});

askButton.addEventListener("click", ask);
questionInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") ask();
});

// Heartbeat — пока страница открыта, сервер знает, что он ещё нужен.
setInterval(() => {
  fetch("/ping").catch(() => {});
}, 3000);

// Мгновенное закрытие сервера при закрытии/уходе со страницы.
function notifyShutdown() {
  navigator.sendBeacon("/shutdown");
}
window.addEventListener("pagehide", notifyShutdown);
window.addEventListener("beforeunload", notifyShutdown);
</script>
</body>
</html>
